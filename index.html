<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jess's Gym Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #c2526e;
    --rose-light: #f5dce3;
    --rose-dark: #8a2d46;
    --sage: #6b8f71;
    --sage-light: #e4ede5;
    --cream: #faf7f2;
    --warm-gray: #8a8178;
    --dark: #2a2420;
    --border: rgba(42,36,32,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
    padding: 0 0 60px;
  }
  header {
    background: var(--dark);
    color: white;
    padding: 28px 24px 24px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    right: -40px; top: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: var(--rose);
    opacity: 0.15;
  }
  header::after {
    content: '';
    position: absolute;
    right: 40px; bottom: -60px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: var(--rose);
    opacity: 0.08;
  }
  .header-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--rose);
    margin-bottom: 6px;
    font-weight: 500;
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: white;
    line-height: 1.1;
    margin-bottom: 4px;
  }
  header p {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    font-weight: 300;
  }
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: white;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .week-nav button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 34px; height: 34px;
    cursor: pointer;
    font-size: 16px;
    color: var(--dark);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .week-nav button:hover { background: var(--rose-light); border-color: var(--rose); }
  .week-label { font-size: 13px; font-weight: 500; color: var(--dark); }
  .week-label span { color: var(--warm-gray); font-weight: 300; }
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    background: white;
    padding: 14px 16px;
    text-align: center;
  }
  .stat-val { font-size: 20px; font-weight: 500; color: var(--rose); }
  .stat-lbl { font-size: 11px; color: var(--warm-gray); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.08em; }
  .days-container { padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
  .day-card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: box-shadow 0.2s;
  }
  .day-card.completed { border-color: var(--sage); }
  .day-header {
    display: flex;
    align-items: center;
    padding: 14px 18px;
    cursor: pointer;
    gap: 12px;
    user-select: none;
  }
  .day-dot {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--rose-light);
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Serif Display', serif;
    font-size: 14px;
    color: var(--rose-dark);
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .day-card.completed .day-dot {
    background: var(--sage);
    color: white;
  }
  .day-info { flex: 1; }
  .day-name { font-size: 14px; font-weight: 500; color: var(--dark); }
  .day-focus { font-size: 12px; color: var(--warm-gray); margin-top: 1px; }
  .day-chevron { font-size: 18px; color: var(--warm-gray); transition: transform 0.2s; }
  .day-card.open .day-chevron { transform: rotate(180deg); }
  .day-progress {
    height: 3px;
    background: var(--rose-light);
    margin: 0 18px 14px;
    border-radius: 2px;
    overflow: hidden;
  }
  .day-progress-fill {
    height: 100%;
    background: var(--rose);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .day-card.completed .day-progress-fill { background: var(--sage); }
  .exercises {
    display: none;
    padding: 0 18px 16px;
    border-top: 1px solid var(--border);
  }
  .day-card.open .exercises { display: block; }
  .ex-item {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    cursor: pointer;
  }
  .ex-item:last-child { border-bottom: none; }
  .ex-check {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    background: white;
  }
  .ex-item.done .ex-check {
    background: var(--rose);
    border-color: var(--rose);
    color: white;
  }
  .ex-item.done .ex-check::after { content: '✓'; font-size: 12px; }
  .ex-body { flex: 1; }
  .ex-name { font-size: 14px; font-weight: 500; color: var(--dark); transition: color 0.2s; }
  .ex-item.done .ex-name { color: var(--warm-gray); text-decoration: line-through; }
  .ex-detail { font-size: 12px; color: var(--warm-gray); margin-top: 2px; }
  .ex-notes {
    font-size: 11px;
    color: var(--rose-dark);
    background: var(--rose-light);
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .yoga-card {
    background: white;
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .yoga-card.done { border-color: var(--sage); }
  .yoga-dot {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--sage-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .yoga-card.done .yoga-dot { background: var(--sage); }
  .yoga-info { flex: 1; }
  .yoga-name { font-size: 14px; font-weight: 500; color: var(--dark); }
  .yoga-detail { font-size: 12px; color: var(--warm-gray); margin-top: 1px; }
  .yoga-check {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    background: white;
    transition: all 0.2s;
  }
  .yoga-card.done .yoga-check { background: var(--sage); border-color: var(--sage); color: white; }
  .yoga-card.done .yoga-check::after { content: '✓'; font-size: 12px; }
  .section-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--warm-gray);
    font-weight: 500;
    padding: 0 4px;
    margin-bottom: 8px;
    margin-top: 4px;
  }
  .reset-btn {
    display: block;
    margin: 24px auto 0;
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 20px;
    font-size: 12px;
    color: var(--warm-gray);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }
  .reset-btn:hover { border-color: var(--rose); color: var(--rose); }
  .share-btn {
    display: block;
    margin: 12px auto 0;
    background: var(--rose);
    border: none;
    border-radius: 20px;
    padding: 10px 24px;
    font-size: 13px;
    color: white;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    transition: all 0.2s;
  }
  .share-btn:hover { background: var(--rose-dark); }
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--dark);
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    transition: transform 0.3s;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="header-label">Weekly Gym Tracker</div>
  <h1>Jess's<br><em>Workout Plan</em></h1>
  <p>3 lift days · 4 hot yoga · 2 core breathing</p>
</header>

<div class="week-nav">
  <button onclick="changeWeek(-1)">&#8592;</button>
  <div class="week-label" id="weekLabel">Week of <span id="weekDate"></span></div>
  <button onclick="changeWeek(1)">&#8594;</button>
</div>

<div class="stats-row">
  <div class="stat">
    <div class="stat-val" id="liftCount">0/3</div>
    <div class="stat-lbl">Lifts</div>
  </div>
  <div class="stat">
    <div class="stat-val" id="yogaCount">0/4</div>
    <div class="stat-lbl">Yoga</div>
  </div>
  <div class="stat">
    <div class="stat-val" id="coreCount">0/2</div>
    <div class="stat-lbl">Core</div>
  </div>
</div>

<div class="days-container" id="daysContainer"></div>

<div style="padding: 0 16px;">
  <button class="share-btn" onclick="copyProgress()">Copy progress to share with Claude ↗</button>
  <button class="reset-btn" onclick="resetWeek()">Reset this week</button>
</div>

<div style="padding: 0 16px; margin-top: 32px; padding-bottom: 40px;">
  <div class="section-label" style="margin-bottom: 4px;">📅 Workout History</div>
  <div style="font-size:11px; color:var(--warm-gray); margin-bottom:16px; padding-left:4px;">Every day since June — tap a square to see what it was</div>
  <div id="historyGrid"></div>
  <div id="historyTooltip" style="display:none; background:var(--dark); color:white; padding:8px 14px; border-radius:10px; font-size:12px; margin-top:12px; text-align:center; line-height:1.5;"></div>
  <div style="display:flex; gap:16px; margin-top:16px; padding-left:4px; flex-wrap:wrap;">
    <div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--warm-gray);">
      <div style="width:14px;height:14px;border-radius:3px;background:var(--rose);"></div> Lifting
    </div>
    <div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--warm-gray);">
      <div style="width:14px;height:14px;border-radius:3px;background:var(--sage);"></div> Hot yoga / Pilates
    </div>
    <div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--warm-gray);">
      <div style="width:14px;height:14px;border-radius:3px;background:#c87941;"></div> Running
    </div>
    <div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--warm-gray);">
      <div style="width:14px;height:14px;border-radius:3px;background:var(--border);border:1px solid #ccc;"></div> Rest
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WORKOUTS = [
  {
    id: 'A',
    name: 'Day 1 — Full body A',
    focus: 'Back · chest · glutes · shoulders · hip thrust',
    exercises: [
      { name: 'Lat pulldown', detail: '3 sets × 10 reps @ 57.5 lbs' },
      { name: 'Chest press', detail: '3 sets × 10 reps @ 30 lbs' },
      { name: 'Glute kickback', detail: '3 sets × 10 reps @ 37.5 lbs' },
      { name: 'Shoulder press', detail: '3 sets × 10 reps @ 20 lbs' },
      { name: 'Hip thrust machine', detail: '3 sets × 12 reps @ 25 lbs' },
    ]
  },
  {
    id: 'B',
    name: 'Day 2 — Full body B',
    focus: 'Back · legs · triceps · hamstrings · biceps',
    exercises: [
      { name: 'Lat pulldown', detail: '3 sets × 10 reps @ 57.5 lbs' },
      { name: 'Leg press', detail: '3 sets × 10–12 reps @ 80 lbs' },
      { name: 'Tricep extension', detail: '3 sets × 12 reps @ 32 lbs' },
      { name: 'Hamstring curl', detail: '3 sets × 12 reps @ 55 lbs — or goblet squat 3 × 10–12 @ 15 lb KB' },
      { name: 'Bicep curl', detail: '3 sets × 12 reps @ 10 lbs' },
    ]
  },
  {
    id: 'C',
    name: 'Day 3 — Full body C',
    focus: 'Chest · glutes · shoulders · hips · deadlift · biceps',
    exercises: [
      { name: 'Chest press', detail: '3 sets × 10 reps @ 30 lbs' },
      { name: 'Glute kickback', detail: '3 sets × 10 reps @ 37.5 lbs' },
      { name: 'Shoulder press', detail: '3 sets × 10 reps @ 20 lbs' },
      { name: 'Hip abductor', detail: '3 sets × 15 reps @ 65 lbs' },
      { name: 'Romanian deadlift', detail: '3 sets × 10 reps @ 8 lbs' },
      { name: 'Bicep curl', detail: '3 sets × 10 reps @ 10 lbs' },
    ]
  }
];

const YOGA_DAYS = 4;
const CORE_DAYS = 2;

let currentWeekOffset = 0;
let state = {};

function getWeekKey(offset) {
  const d = new Date();
  d.setDate(d.getDate() - d.getDay() + 1 + offset * 7);
  return d.toISOString().slice(0, 10);
}

function getWeekLabel(offset) {
  const d = new Date();
  d.setDate(d.getDate() - d.getDay() + 1 + offset * 7);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function loadState() {
  const key = 'gymTracker_' + getWeekKey(currentWeekOffset);
  const saved = localStorage.getItem(key);
  state = saved ? JSON.parse(saved) : {
    workouts: { A: [], B: [], C: [] },
    yoga: 0,
    core: 0
  };
}

function saveState() {
  const key = 'gymTracker_' + getWeekKey(currentWeekOffset);
  localStorage.setItem(key, JSON.stringify(state));
}

function updateStats() {
  const liftsDone = WORKOUTS.filter(w => state.workouts[w.id].length === w.exercises.length).length;
  document.getElementById('liftCount').textContent = liftsDone + '/3';
  document.getElementById('yogaCount').textContent = state.yoga + '/4';
  document.getElementById('coreCount').textContent = state.core + '/2';
}

function toggleExercise(workoutId, exIdx) {
  const arr = state.workouts[workoutId];
  const pos = arr.indexOf(exIdx);
  if (pos > -1) arr.splice(pos, 1); else arr.push(exIdx);
  saveState();
  renderDays();
  updateStats();
}

function toggleYoga() {
  state.yoga = Math.min(YOGA_DAYS, state.yoga + 1);
  if (state.yoga > YOGA_DAYS) state.yoga = 0;
  saveState();
  renderDays();
  updateStats();
}

function toggleCore() {
  state.core = Math.min(CORE_DAYS, state.core + 1);
  if (state.core > CORE_DAYS) state.core = 0;
  saveState();
  renderDays();
  updateStats();
}

let openCards = { A: false, B: false, C: false };

function toggleCard(id) {
  openCards[id] = !openCards[id];
  renderDays();
}

function renderDays() {
  const container = document.getElementById('daysContainer');
  let html = '<div class="section-label">Lifting days</div>';

  WORKOUTS.forEach(w => {
    const done = state.workouts[w.id];
    const total = w.exercises.length;
    const pct = Math.round((done.length / total) * 100);
    const isComplete = done.length === total;
    const isOpen = openCards[w.id];

    html += `<div class="day-card ${isComplete ? 'completed' : ''} ${isOpen ? 'open' : ''}">
      <div class="day-header" onclick="toggleCard('${w.id}')">
        <div class="day-dot">${isComplete ? '✓' : w.id}</div>
        <div class="day-info">
          <div class="day-name">${w.name}</div>
          <div class="day-focus">${w.focus}</div>
        </div>
        <div class="day-chevron">⌄</div>
      </div>
      <div class="day-progress"><div class="day-progress-fill" style="width:${pct}%"></div></div>
      <div class="exercises">`;

    w.exercises.forEach((ex, i) => {
      const isDone = done.includes(i);
      html += `<div class="ex-item ${isDone ? 'done' : ''}" onclick="toggleExercise('${w.id}', ${i})">
        <div class="ex-check"></div>
        <div class="ex-body">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-detail">${ex.detail}</div>
        </div>
        ${ex.note ? `<div class="ex-notes">${ex.note}</div>` : ''}
      </div>`;
    });

    html += `</div></div>`;
  });

  html += '<div class="section-label" style="margin-top:16px;">Hot yoga / Pilates</div>';
  for (let i = 0; i < YOGA_DAYS; i++) {
    const done = i < state.yoga;
    html += `<div class="yoga-card ${done ? 'done' : ''}" onclick="toggleYoga()">
      <div class="yoga-dot">${done ? '🧘' : '🧘'}</div>
      <div class="yoga-info">
        <div class="yoga-name">Hot yoga / Pilates — session ${i+1}</div>
        <div class="yoga-detail">60 min · hydrate well before and after</div>
      </div>
      <div class="yoga-check"></div>
    </div>`;
  }

  html += '<div class="section-label" style="margin-top:16px;">Core breathing</div>';
  for (let i = 0; i < CORE_DAYS; i++) {
    const done = i < state.core;
    html += `<div class="yoga-card ${done ? 'done' : ''}" onclick="toggleCore()">
      <div class="yoga-dot">${done ? '💨' : '💨'}</div>
      <div class="yoga-info">
        <div class="yoga-name">Core breathing — session ${i+1}</div>
        <div class="yoga-detail">Can do on rest days or yoga days</div>
      </div>
      <div class="yoga-check"></div>
    </div>`;
  }

  container.innerHTML = html;
}

function changeWeek(dir) {
  currentWeekOffset += dir;
  document.getElementById('weekDate').textContent = getWeekLabel(currentWeekOffset);
  loadState();
  renderDays();
  updateStats();
}

function resetWeek() {
  if (confirm('Reset all progress for this week?')) {
    state = { workouts: { A: [], B: [], C: [] }, yoga: 0, core: 0 };
    openCards = { A: false, B: false, C: false };
    saveState();
    renderDays();
    updateStats();
  }
}

function copyProgress() {
  const liftsDone = WORKOUTS.filter(w => state.workouts[w.id].length === w.exercises.length).length;
  const lines = [`Week of ${getWeekLabel(currentWeekOffset)} — workout summary:`];
  lines.push(`Lifts completed: ${liftsDone}/3`);
  WORKOUTS.forEach(w => {
    const done = state.workouts[w.id];
    if (done.length > 0) {
      lines.push(`${w.name}: ${done.length}/${w.exercises.length} exercises done`);
      done.forEach(i => lines.push(`  ✓ ${w.exercises[i].name}`));
    }
  });
  lines.push(`Hot yoga: ${state.yoga}/4 sessions`);
  lines.push(`Core breathing: ${state.core}/2 sessions`);
  navigator.clipboard.writeText(lines.join('\n')).then(() => showToast('Progress copied! Paste it in your chat with Claude.'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function renderHistory() {
  const container = document.getElementById('historyGrid');
  const months = [
    { label: 'Jun', year: 2026, month: 5 },
    { label: 'Jul', year: 2026, month: 6 },
    { label: 'Aug', year: 2026, month: 7 },
    { label: 'Sep', year: 2026, month: 8 },
    { label: 'Oct', year: 2026, month: 9 },
  ];

  let html = '';
  months.forEach(m => {
    const daysInMonth = new Date(m.year, m.month + 1, 0).getDate();
    const today = new Date().toISOString().slice(0,10);
    let lifts = 0, yoga = 0, runs = 0;

    // Count totals for completed days
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${m.year}-${String(m.month + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if (dateStr > today) continue;
      const entry = WORKOUT_LOG[dateStr];
      if (!entry) continue;
      if (entry.type === 'lift') lifts++;
      else if (entry.type === 'yoga') yoga++;
      else if (entry.type === 'run') runs++;
    }

    let totalsHtml = `<span style="color:var(--rose);font-weight:600;">${lifts} lift${lifts !== 1 ? 's' : ''}</span>`;
    totalsHtml += ` · <span style="color:var(--sage);font-weight:600;">${yoga} yoga</span>`;
    if (runs > 0) totalsHtml += ` · <span style="color:#c87941;font-weight:600;">${runs} run${runs !== 1 ? 's' : ''}</span>`;

    html += `<div style="margin-bottom:22px;">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px;padding-left:2px;">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--warm-gray);">${m.label} ${m.year}</span>
        <span style="font-size:11px;">${totalsHtml}</span>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:4px;">`;

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${m.year}-${String(m.month + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const entry = WORKOUT_LOG[dateStr];
      const isFuture = dateStr > today;
      let bg, border;
      if (isFuture) {
        bg = 'transparent'; border = '1px dashed #ddd';
      } else if (!entry) {
        bg = '#ede9e3'; border = '1px solid #ddd';
      } else if (entry.type === 'lift') {
        bg = 'var(--rose)'; border = 'none';
      } else if (entry.type === 'run') {
        bg = '#c87941'; border = 'none';
      } else {
        bg = 'var(--sage)'; border = 'none';
      }

      html += `<div
        title="${dateStr}"
        data-date="${dateStr}"
        data-label="${entry ? entry.label : ''}"
        style="width:28px;height:28px;border-radius:5px;background:${bg};border:${border};cursor:${entry ? 'pointer' : 'default'};display:flex;align-items:center;justify-content:center;font-size:10px;color:${entry ? 'white' : '#aaa'};font-weight:500;transition:transform 0.1s;"
        onmouseenter="showTip(this)"
        onmouseleave="hideTip()"
        onclick="showTip(this, true)"
      >${d}</div>`;
    }
    html += `</div></div>`;
  });

  container.innerHTML = html;
}

function showTip(el, sticky) {
  const tooltip = document.getElementById('historyTooltip');
  const label = el.dataset.label;
  const date = el.dataset.date;
  if (!label) return;
  const d = new Date(date + 'T12:00:00');
  const formatted = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  tooltip.innerHTML = `<strong>${formatted}</strong><br>${label}`;
  tooltip.style.display = 'block';
}

function hideTip() {
  // keep visible on mobile tap; hide on next mouseleave only after delay
  setTimeout(() => {
    document.getElementById('historyTooltip').style.display = 'none';
  }, 2000);
}

document.getElementById('weekDate').textContent = getWeekLabel(0);
loadState();
renderDays();
updateStats();
renderHistory();

</script>
